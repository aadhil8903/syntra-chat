<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Syntra Chat</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Syntra Chat - Enterprise Knowledge & Data Intelligence Platform">
  <meta property="og:title" content="Syntra Chat">
  <meta property="og:description" content="Enterprise Knowledge & Data Intelligence Platform">
  <meta property="og:image" content="/logo.png">
  <link rel="icon" type="image/svg+xml" href="/logo-icon.svg">
  <link rel="icon" type="image/png" href="/logo-icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/config.js"></script>
  <script>
    (function() {
      try {
        var mode = localStorage.getItem('syntra_theme_mode');
        var isDark = mode === 'dark' || (!mode || mode === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : false);
        var root = document.documentElement;
        if (!isDark) {
          root.classList.remove('dark');
          root.classList.add('light');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        } else {
          root.classList.remove('light');
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[#f7f8fa] dark:bg-[#09090b] text-[#111214] dark:text-[#fafafa] antialiased overflow-hidden font-sans">
  <app-root></app-root>
</body>
</html>
